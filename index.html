<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube DIO</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>

        <div class="menu-youtube">
            <img src="assets/images/menu.png" alt="Menu Icon" class="menu-icon">
            <img src="assets/images/youtube 1.png" alt="Youtube icon" class="youtube-icon">
        </div>

        <div class="search-bar">
            <input type="text" placeholder="Pesquisar" class="search-input">
            <button class="search-icon-button">
                    <img src="assets/images/search.png" alt="Youtube search bar" class="search-icon">
                
            </button>
            
        </div>

        <div class="perfil">
            <img src="assets/images/video.png" alt="Video icon" class="right-icon">
            <img src="assets/images/bell.png" alt="Bell icon" class="right-icon">
            <img src="assets/images/avatar.jpeg" alt="Avatar icon" class="avatar">
        </div>
    </header>

    <main></main>

    <footer></footer>

</body>
</html>
